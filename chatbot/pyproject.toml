[tool.poetry]
name = "bethepet-chatbot"
version = "0.1.0"
description = "ChatBot service for BethePet"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.141.1"
uvicorn = "^0.54.0"
python-dotenv = "^1.0.1"
openai = "^1.12.0"
pydantic = {extras = ["email"], version = "^2.11.4"}
sqlalchemy = ">=2.0.54,<2.1"
psycopg2-binary = "^2.9.9"
websockets = "^12.0"
pydantic-settings = "^2.0"
pyjwt = "^2.15.0"
passlib = "1.7.4"
bcrypt = "4.0.1"
boto3 = "^1.38.32"
python-multipart = "^0.0.32"
pillow = "^12.3.0"
pandas = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.12.0"
