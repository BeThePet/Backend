[tool.poetry]
name = "bethepet-chatbot"
version = "0.1.0"
description = "ChatBot service for BethePet"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
python-dotenv = "^1.0.1"
openai = "^1.12.0"
pydantic = {extras = ["email"], version = "^2.11.4"}
sqlalchemy = "^2.0.29"
psycopg2-binary = "^2.9.9"
websockets = "^12.0"
pydantic-settings = "^2.0"
python-jose = "^3.3.0"
passlib = "1.7.4"
bcrypt = "4.0.1"
boto3 = "^1.38.32"
python-multipart = "^0.0.20"
pillow = "^11.2.1"
pandas = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.12.0"