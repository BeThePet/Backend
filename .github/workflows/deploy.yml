name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    # v3 pinned to an immutable commit to prevent tag-repointing attacks.
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

    - name: Configure AWS credentials
      # v1 pinned to an immutable commit to prevent tag-repointing attacks.
      uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      # v1 pinned to an immutable commit to prevent tag-repointing attacks.
      uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: bowwow/backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Deploy to EC2
      # master pinned to the reviewed commit to prevent branch-repointing attacks.
      uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/app
          
          # Pull latest code changes
          git pull origin main
          
          # Update image tag in docker-compose file
          sed -i "s|build:|image: ${{ steps.login-ecr.outputs.registry }}/bowwow/backend:${{ github.sha }}|g" docker-compose.prod.yml
          
          # Restart services
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml up -d
          
          # Clean up old images
          docker image prune -f
