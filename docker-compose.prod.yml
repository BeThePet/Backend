services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - bethepet_api
    networks:
      - app_network

  bethepet_api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:  
      - "8000"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - app_network

networks:
  app_network:
    driver: bridge 